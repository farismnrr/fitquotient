services:
  fitquotient:
    image: ghcr.io/farismnrr/fitquotient:${TAG:-latest}
    container_name: fitquotient
    env_file:
      - .env
    ports:
      - "${UI_PORT:-3000}:3000"
      - "${CORE_PORT:-5400}:5400"
      - "${CV_ASSESSOR_PORT:-5500}:5500"
    volumes:
      - uploads:/home/appuser/core/uploads
      - ./sqlite_data:/home/appuser/core/sqlite_data
      - ./docker-startup.sh:/home/appuser/docker-startup.sh
    networks:
      - fitquotient
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5400/healthcheck >/dev/null && curl -fsS http://127.0.0.1:5500/healthcheck >/dev/null && curl -fsS http://127.0.0.1:3000/api/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fitquotient-redis
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    networks:
      - fitquotient
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: fitquotient-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - fitquotient
    restart: unless-stopped
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  fitquotient:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  uploads:
    driver: local
