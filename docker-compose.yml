services:
  fitquotient:
    image: ghcr.io/farismnrr/fitquotient:${TAG:-dev}
    container_name: fitquotient
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GIN_MODE: ${GIN_MODE:-release}
      CORE_PORT: ${CORE_PORT:-5400}
      CV_ASSESSOR_PORT: ${CV_ASSESSOR_PORT:-5500}
      UI_PORT: ${UI_PORT:-3000}
    ports:
      - "${UI_PORT:-3000}:3000"
      - "${CORE_PORT:-5400}:5400"
      - "${CV_ASSESSOR_PORT:-5500}:5500"
    volumes:
      - ./fitquotient_core/uploads:/home/appuser/core/uploads
    networks:
      - fitquotient
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5400/healthcheck >/dev/null && curl -fsS http://127.0.0.1:5500/healthcheck >/dev/null && curl -fsS http://127.0.0.1:3000/api/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: fitquotient-postgres
    environment:
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASS}
      POSTGRES_DB: ${CORE_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fitquotient_core/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fitquotient
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME} -h 127.0.0.1 -p ${CORE_DB_PORT:-5432}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fitquotient-redis
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    networks:
      - fitquotient
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: fitquotient-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - fitquotient
    restart: unless-stopped
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}

networks:
  fitquotient:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  uploads:
    driver: local
